[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ising-metropolis"
version = "0.1.0"
description = "ДЗ1: 2D модель Ізінга (Метрополіс) — e1, e2, e6"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "matplotlib",
    "tqdm",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
